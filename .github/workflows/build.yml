name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Determine release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      short_hash: ${{ steps.metadata.outputs.short_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version and commit
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +'%Y.%-m.%-d')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_hash=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OverlayMonitor.sln -c Release

      - name: Test
        run: dotnet test OverlayMonitor.sln -c Release --no-build

  build:
    name: Publish (${{ matrix.rid }})
    needs: [metadata, verify]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      SHORT_HASH: ${{ needs.metadata.outputs.short_hash }}
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OverlayMonitor.sln -r ${{ matrix.rid }}

      - name: Publish self-contained package
        run: >
          dotnet publish src/OverlayMonitor/OverlayMonitor.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:Version=$env:VERSION
          -o publish/${{ matrix.rid }}
        shell: pwsh

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "release/OverlayMonitor-windows-${{ matrix.rid }}-v$env:VERSION-$env:SHORT_HASH.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: OverlayMonitor-windows-${{ matrix.rid }}
          path: release/OverlayMonitor-windows-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v6
        with:
          pattern: OverlayMonitor-*
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --title "OverlayMonitor $TAG_NAME" \
            --generate-notes \
            --draft
