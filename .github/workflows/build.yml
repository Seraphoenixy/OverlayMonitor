name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (Get-Date -Format 'yyyy.MM.dd')
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore OverlayMonitor.sln -r ${{ matrix.rid }}

      - name: Publish self-contained package
        run: >
          dotnet publish src/OverlayMonitor/OverlayMonitor.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:Version=${{ env.VERSION }}
          -o publish/${{ matrix.rid }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: OverlayMonitor-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v6
        with:
          pattern: OverlayMonitor-*
          path: release-assets

      - name: Create release archives
        run: |
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          for package in release-assets/OverlayMonitor-*; do
            name="$(basename "$package")"
            (cd "$package" && zip -r "../../release-assets/${name}-${{ github.ref_name }}-${SHORT_HASH}.zip" .)
          done

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/*.zip --title "OverlayMonitor $TAG_NAME" --generate-notes --draft